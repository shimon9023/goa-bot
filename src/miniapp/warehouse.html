<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>רשימת המחסן</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f4f6;
    --surface: #ffffff;
    --surface-2: #ececf0;
    --line: rgba(12, 9, 13, .09);
    --line-strong: rgba(12, 9, 13, .16);
    --text: #0c090d;
    --text-2: #5c5c63;
    --text-3: #8b8b93;
    --accent: #0142ff;
    --accent-soft: rgba(1, 66, 255, .09);
    --danger: #c92a2a;
    --r-card: 16px;
    --r-ctl: 12px;
    --ease: cubic-bezier(.32, .72, 0, 1);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0e11;
      --surface: #1a1a1f;
      --surface-2: #24242b;
      --line: rgba(255, 255, 255, .09);
      --line-strong: rgba(255, 255, 255, .18);
      --text: #f3f3f5;
      --text-2: #a8a8b2;
      --text-3: #78788a;
      --accent: #5b8bff;
      --accent-soft: rgba(91, 139, 255, .14);
      --danger: #ff6b6b;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    padding: 0 0 calc(24px + env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--text);
    font-family: Heebo, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
  }

  .top {
    position: sticky;
    top: 0;
    z-index: 5;
    padding: 14px 16px 12px;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--line);
  }

  h1 {
    margin: 0 0 10px;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -.02em;
  }

  .count {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-3);
    letter-spacing: 0;
  }

  input.search {
    width: 100%;
    padding: 11px 14px;
    font: inherit;
    font-size: 16px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: var(--r-ctl);
    outline: none;
    transition: border-color .18s var(--ease), box-shadow .18s var(--ease);
  }

  input.search:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .list { padding: 12px 16px 0; }

  .item {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 12px;
    margin-bottom: 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-card);
    cursor: pointer;
    transition: transform .22s var(--ease), border-color .18s var(--ease);
  }

  .item.pressed {
    transform: scale(.975);
    border-color: var(--accent);
  }

  .thumbs {
    display: flex;
    flex: 0 0 auto;
    gap: 3px;
  }

  .thumb {
    width: 56px;
    height: 56px;
    border-radius: 9px;
    object-fit: cover;
    background: var(--surface-2);
    border: 1px solid var(--line);
  }

  .thumb:nth-child(n+2) { width: 26px; }

  .more {
    display: grid;
    place-items: center;
    width: 26px;
    height: 56px;
    border-radius: 9px;
    background: var(--surface-2);
    color: var(--text-3);
    font-size: 11px;
    font-weight: 700;
  }

  .body { flex: 1; min-width: 0; }

  .name {
    font-weight: 700;
    font-size: 16px;
    letter-spacing: -.01em;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .meta {
    margin-top: 3px;
    font-size: 13px;
    color: var(--text-2);
  }

  .sub {
    margin-top: 2px;
    font-size: 12px;
    color: var(--text-3);
  }

  .state {
    padding: 48px 24px;
    text-align: center;
    color: var(--text-3);
    font-size: 15px;
  }

  .state.err { color: var(--danger); }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: .01ms !important; }
    .item.pressed { transform: none; }
  }

  @media (prefers-reduced-transparency: reduce) {
    .top { background: var(--bg); backdrop-filter: none; -webkit-backdrop-filter: none; }
  }
</style>
</head>
<body>

<div class="top">
  <h1>רשימת המחסן <span class="count" id="count"></span></h1>
  <input class="search" id="search" type="text" placeholder="חפש מוצר" autocomplete="off">
</div>

<div class="list" id="list"><div class="state">טוען…</div></div>

<script>
(function () {
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const list = document.getElementById('list');
  const countEl = document.getElementById('count');
  const search = document.getElementById('search');

  let rows = [];
  let busy = false;

  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function pressable(el, onCommit) {
    let active = false;
    el.addEventListener('pointerdown', (e) => {
      active = true; el.classList.add('pressed'); el.setPointerCapture?.(e.pointerId);
    });
    const release = (commit) => {
      if (!active) return;
      active = false; el.classList.remove('pressed');
      if (commit) onCommit();
    };
    el.addEventListener('pointerup', () => release(true));
    el.addEventListener('pointercancel', () => release(false));
    el.addEventListener('pointerleave', () => release(false));
  }

  function thumbs(row) {
    const total = row.photoCount || 0;
    if (!total) return '<div class="thumbs"><div class="more">אין</div></div>';

    // תמונה שלא נטענת נשארת כריבוע ריק ולא כסמל שבור
    const fallback = 'this.style.visibility=&quot;hidden&quot;';
    const img = (i) =>
      `<img class="thumb" loading="lazy" alt="" onerror="${fallback}" src="/warehouse/photo/${encodeURIComponent(row.id)}/${i}">`;

    const first = img(0);
    const second = total > 1 ? img(1) : '';
    const rest = total > 2 ? `<div class="more">+${total - 2}</div>` : '';

    return `<div class="thumbs">${first}${second}${rest}</div>`;
  }

  function render() {
    const term = search.value.trim();
    const shown = term
      ? rows.filter((r) => (r.description || '').includes(term))
      : rows;

    countEl.textContent = rows.length ? `· ${rows.length} ממתינים` : '';

    if (!rows.length) {
      list.innerHTML = '<div class="state">אין מוצרים שממתינים. כשמישהו יצלם במחסן הם יופיעו כאן.</div>';
      return;
    }

    if (!shown.length) {
      list.innerHTML = '<div class="state">אין התאמה לחיפוש.</div>';
      return;
    }

    list.innerHTML = shown.map((row) => {
      const meta = [
        row.quantity ? `כמות ${esc(row.quantity)}` : '',
        row.minPrice ? `${esc(row.minPrice)} ₪` : '',
        row.photoCount ? `${row.photoCount} תמונות` : '',
      ].filter(Boolean).join(' · ');

      const sub = [row.who, row.date].filter(Boolean).map(esc).join(' · ');

      return `<div class="item" data-id="${esc(row.id)}">
        ${thumbs(row)}
        <div class="body">
          <div class="name">${esc(row.description || 'בלי תיאור')}</div>
          ${meta ? `<div class="meta">${meta}</div>` : ''}
          ${sub ? `<div class="sub">${sub}</div>` : ''}
        </div>
      </div>`;
    }).join('');

    list.querySelectorAll('.item').forEach((el) => {
      pressable(el, () => pick(el.dataset.id));
    });
  }

  async function pick(id) {
    if (busy) return;
    busy = true;

    try {
      const res = await fetch('/api/warehouse/pick', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, initData: tg?.initData || '' }),
      });

      if (!res.ok) throw new Error(await res.text());

      tg?.HapticFeedback?.notificationOccurred('success');
      setTimeout(() => tg?.close(), 350);
    } catch {
      busy = false;
      tg?.HapticFeedback?.notificationOccurred('error');
      alert('לא הצלחתי לפתוח את המוצר. נסה שוב.');
    }
  }

  search.addEventListener('input', render);

  fetch(`/api/warehouse/list?initData=${encodeURIComponent(tg?.initData || '')}`)
    .then((r) => { if (!r.ok) throw new Error(); return r.json(); })
    .then((payload) => { rows = payload.rows || []; render(); })
    .catch(() => {
      list.innerHTML = '<div class="state err">לא הצלחתי לטעון את הרשימה.</div>';
    });
})();
</script>
</body>
</html>
