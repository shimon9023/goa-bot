<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>עריכת מוצר</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f4f6;
    --surface: #ffffff;
    --surface-2: #ececf0;
    --line: rgba(12, 9, 13, .09);
    --line-strong: rgba(12, 9, 13, .16);
    --text: #0c090d;
    --text-2: #5c5c63;
    --text-3: #8b8b93;
    --accent: #0142ff;
    --accent-soft: rgba(1, 66, 255, .09);
    --warn: #9a6700;
    --warn-soft: rgba(250, 188, 60, .2);
    --danger: #c92a2a;
    --r-card: 16px;
    --r-ctl: 12px;
    --ease: cubic-bezier(.32, .72, 0, 1);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0e11;
      --surface: #1a1a1f;
      --surface-2: #24242b;
      --line: rgba(255, 255, 255, .09);
      --line-strong: rgba(255, 255, 255, .18);
      --text: #f3f3f5;
      --text-2: #a8a8b2;
      --text-3: #78788a;
      --accent: #5b8bff;
      --accent-soft: rgba(91, 139, 255, .14);
      --warn: #fabc3c;
      --warn-soft: rgba(250, 188, 60, .14);
      --danger: #ff6b6b;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    padding: 18px 16px calc(96px + env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--text);
    font-family: Heebo, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
  }

  .field { margin-bottom: 20px; }

  label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .05em;
    color: var(--text-3);
    margin-bottom: 7px;
  }

  input[type="text"], textarea {
    width: 100%;
    padding: 13px 14px;
    background: var(--surface);
    border: none;
    box-shadow: 0 0 0 1px var(--line);
    border-radius: var(--r-ctl);
    color: var(--text);
    font-family: inherit;
    font-size: 16px;
    line-height: 1.55;
    resize: vertical;
    transition: box-shadow .3s var(--ease);
  }

  input[type="text"]:focus, textarea:focus {
    outline: none;
    box-shadow: 0 0 0 2px var(--accent);
  }

  textarea.one { min-height: 62px; }
  textarea.short { min-height: 84px; }
  textarea.long { min-height: 200px; }

  .count {
    font-size: 12px;
    color: var(--text-3);
    margin-top: 5px;
    text-align: left;
    font-variant-numeric: tabular-nums;
  }
  .count.over { color: var(--danger); font-weight: 500; }
  .count.good { color: var(--accent); }

  .hint { font-size: 13px; color: var(--text-3); margin-top: 5px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }

  .chip {
    padding: 8px 14px;
    background: var(--surface);
    box-shadow: 0 0 0 1px var(--line);
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background .28s var(--ease), color .28s var(--ease),
                box-shadow .28s var(--ease), transform .28s var(--ease);
    touch-action: manipulation;
  }

  .chip.pressed { transform: scale(.955); }
  .chip.on { background: var(--accent); color: #fff; box-shadow: none; }

  .card {
    background: var(--surface);
    border-radius: var(--r-card);
    padding: 15px 16px;
    margin-bottom: 20px;
    box-shadow: 0 1px 2px rgba(12, 9, 13, .05), 0 0 0 1px var(--line);
  }

  .card h2 {
    margin: 0 0 11px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .05em;
    color: var(--text-3);
  }

  .comp {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 14px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
  }
  .comp:last-of-type { border-bottom: none; }
  .comp a { color: var(--accent); text-decoration: none; font-weight: 500; }
  .comp .range { font-variant-numeric: tabular-nums; font-weight: 500; }
  .comp .none { color: var(--text-3); font-size: 14px; }

  .footnote {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    font-size: 13px;
    color: var(--text-3);
  }

  .angle {
    background: var(--accent-soft);
    border-radius: var(--r-ctl);
    padding: 11px 13px;
    font-size: 14px;
    line-height: 1.45;
    margin-top: 10px;
  }

  .price-row { display: flex; align-items: center; gap: 10px; }
  .price-row input { flex: 1; }
  .price-row .unit { font-size: 18px; color: var(--text-3); font-weight: 500; }

  .notes {
    background: var(--warn-soft);
    border-radius: var(--r-card);
    padding: 13px 15px;
    margin-bottom: 20px;
    font-size: 14px;
    line-height: 1.5;
    color: var(--warn);
  }

  .notes strong { display: block; margin-bottom: 4px; font-size: 12px; letter-spacing: .05em; }

  .bottom {
    position: fixed;
    inset-inline: 0;
    bottom: 0;
    z-index: 20;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--bg) 76%, transparent);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    display: flex;
    gap: 10px;
  }

  button.act {
    flex: 1;
    padding: 15px;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -.01em;
    font-family: inherit;
    cursor: pointer;
    transition: transform .3s var(--ease), opacity .3s var(--ease);
    touch-action: manipulation;
  }

  button.act.pressed { transform: scale(.982); }
  button.act:disabled { opacity: .5; }

  button.draft { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--line-strong); }
  button.live { background: var(--accent); color: #fff; }

  .state { text-align: center; padding: 64px 20px; color: var(--text-2); }
  .state.err { color: var(--danger); }
  .err-line { color: var(--danger); font-size: 13px; margin-top: 6px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: .01ms !important; }
    .chip.pressed, button.act.pressed { transform: none; }
  }

  @media (prefers-reduced-transparency: reduce) {
    .bottom { background: var(--bg); backdrop-filter: none; -webkit-backdrop-filter: none; }
  }
</style>
</head>
<body>

<div id="root"><div class="state">טוען…</div></div>

<script>
(function () {
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const draftId = location.pathname.split('/').filter(Boolean).pop();
  const root = document.getElementById('root');
  let data = null, allCategories = [], allTags = [];

  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function pressable(el, onCommit) {
    let active = false;
    el.addEventListener('pointerdown', (e) => {
      active = true; el.classList.add('pressed'); el.setPointerCapture?.(e.pointerId);
    });
    const release = (commit) => {
      if (!active) return;
      active = false; el.classList.remove('pressed');
      if (commit) onCommit();
    };
    el.addEventListener('pointerup', () => release(true));
    el.addEventListener('pointercancel', () => release(false));
    el.addEventListener('pointerleave', () => release(false));
  }

  function chips(list, selected, group) {
    return list.map((item) => {
      const on = selected.includes(item.name) ? ' on' : '';
      return `<div class="chip${on}" data-group="${group}" data-name="${esc(item.name)}">${esc(item.name)}</div>`;
    }).join('');
  }

  function competitorBlock() {
    const r = data.research;
    if (!r || !r.found) {
      return `<section class="card"><h2>מחירים אצל המתחרים</h2>
        <div class="comp"><span class="none">${esc(r?.message || 'לא נמצא אצל המתחרים')}</span></div></section>`;
    }

    const rows = r.results.map((c) => {
      if (c.status === 'ok') {
        const range = c.min === c.max ? `${c.min} ₪` : `${c.min}-${c.max} ₪`;
        return `<div class="comp"><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.name)}</a><span class="range">${range}</span></div>`;
      }
      return `<div class="comp"><span>${esc(c.name)}</span><span class="none">${c.status === 'not_found' ? 'לא נמצא' : 'לא הצלחתי לבדוק'}</span></div>`;
    }).join('');

    return `<section class="card"><h2>מחירים אצל המתחרים</h2>${rows}
      <div class="footnote">המחיר נקבע על ידך בלבד.</div></section>`;
  }

  function render() {
    const c = data;

    root.innerHTML = `
      <div class="field">
        <label for="name">שם המוצר</label>
        <input type="text" id="name" value="${esc(c.name)}">
      </div>

      <div class="field">
        <label>קטגוריות</label>
        <div class="chips" id="cats">${chips(allCategories, c.categories || [], 'cat')}</div>
      </div>

      <div class="field">
        <label>תגיות</label>
        <div class="chips" id="tags">${chips(allTags, c.tags || [], 'tag')}</div>
      </div>

      <div class="field">
        <label for="short">תיאור קצר</label>
        <textarea id="short" class="one">${esc(c.shortDescription)}</textarea>
        <div class="hint">משפט אחד, עד 15 מילים</div>
      </div>

      <div class="field">
        <label for="desc">תיאור מלא</label>
        <textarea id="desc" class="long">${esc(c.description)}</textarea>
      </div>

      <div class="field">
        <label for="mtitle">מטא כותרת</label>
        <input type="text" id="mtitle" value="${esc(c.metaTitle)}">
        <div class="count" id="mtitle-count"></div>
      </div>

      <div class="field">
        <label for="mdesc">מטא תיאור</label>
        <textarea id="mdesc" class="short">${esc(c.metaDescription)}</textarea>
        <div class="count" id="mdesc-count"></div>
      </div>

      ${c.angle ? `<div class="angle">${esc(c.angle)}</div>` : ''}

      ${competitorBlock()}

      <div class="field">
        <label for="price">מחיר</label>
        <div class="price-row">
          <input type="text" id="price" inputmode="decimal" value="${c.priceFromUser ?? ''}" placeholder="לא נקבע">
          <span class="unit">₪</span>
        </div>
      </div>

      <div class="field">
        <label for="stock">כמות במלאי</label>
        <input type="text" id="stock" inputmode="numeric" value="${c.stockQuantity ?? ''}" placeholder="ריק = לא מנהל כמות">
      </div>

      ${c.notes ? `<div class="notes"><strong>דברים שלא הייתי בטוח בהם</strong>${esc(c.notes)}</div>` : ''}

      <div class="bottom">
        <button class="act draft" id="save-draft">שמור כטיוטה</button>
        <button class="act live" id="publish">פרסם לאוויר</button>
      </div>`;

    root.querySelectorAll('.chip').forEach((el) => {
      pressable(el, () => {
        el.classList.toggle('on');
        tg?.HapticFeedback?.selectionChanged();
      });
    });

    // מונים לפי טווחי Yoast
    [['mtitle', 'mtitle-count', 45, 60], ['mdesc', 'mdesc-count', 130, 160]]
      .forEach(([inputId, countId, min, max]) => {
        const input = document.getElementById(inputId);
        const out = document.getElementById(countId);
        const update = () => {
          const n = input.value.length;
          out.textContent = `${n} תווים · היעד ${min} עד ${max}`;
          out.className = n > max ? 'count over' : (n >= min ? 'count good' : 'count');
        };
        input.addEventListener('input', update);
        update();
      });

    pressable(document.getElementById('save-draft'), () => submit('draft'));
    pressable(document.getElementById('publish'), () => submit('publish'));
  }

  function collect() {
    const picked = (group) =>
      [...root.querySelectorAll(`.chip.on[data-group="${group}"]`)].map((el) => el.dataset.name);

    const price = document.getElementById('price').value.trim();
    const stock = document.getElementById('stock').value.trim();

    return {
      name: document.getElementById('name').value.trim(),
      categories: picked('cat'),
      tags: picked('tag'),
      shortDescription: document.getElementById('short').value.trim(),
      description: document.getElementById('desc').value.trim(),
      metaTitle: document.getElementById('mtitle').value.trim(),
      metaDescription: document.getElementById('mdesc').value.trim(),
      priceFromUser: price ? Number(price) : null,
      stockQuantity: stock ? Number(stock) : null,
    };
  }

  function showError(fieldId, message) {
    const field = document.getElementById(fieldId).closest('.field');
    let line = field.querySelector('.err-line');
    if (!line) {
      line = document.createElement('div');
      line.className = 'err-line';
      field.appendChild(line);
    }
    line.textContent = message;
    document.getElementById(fieldId).addEventListener('input', () => line.remove(), { once: true });
  }

  async function submit(status) {
    const content = collect();

    if (!content.name) {
      showError('name', 'צריך שם למוצר');
      tg?.HapticFeedback?.notificationOccurred('error');
      return;
    }

    const buttons = root.querySelectorAll('button.act');
    buttons.forEach((b) => (b.disabled = true));

    try {
      const res = await fetch(`/api/product/${draftId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content, status, initData: tg?.initData || '' }),
      });

      if (!res.ok) throw new Error(await res.text());

      tg?.HapticFeedback?.notificationOccurred('success');
      setTimeout(() => tg?.close(), 450);
    } catch {
      buttons.forEach((b) => (b.disabled = false));
      tg?.HapticFeedback?.notificationOccurred('error');
      alert('לא הצלחתי לשמור. נסה שוב.');
    }
  }

  fetch(`/api/product/${draftId}`)
    .then((r) => { if (!r.ok) throw new Error(); return r.json(); })
    .then((payload) => {
      data = payload.content;
      allCategories = payload.categories;
      allTags = payload.tags;
      render();
    })
    .catch(() => {
      root.innerHTML = '<div class="state err">לא הצלחתי לטעון את הטיוטה.</div>';
    });
})();
</script>
</body>
</html>
